# Nom du workflow affiché dans l’onglet Actions
name: CI/CD Pipeline

# Déclencheurs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # JOB 1 : Tests
  test:
    runs-on: ubuntu-latest

    steps:
      # Récupère le code du dépôt
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Installe Python avec le cache pip
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Installe les dépendances
      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Lance les tests
      - name: Lancer les tests
        run: pytest -q

  # JOB 2 : Build Docker
  build:
    # Attend la réussite du job test
    needs: test
    runs-on: ubuntu-latest

    steps:
      # Chaque job dispose de son propre runner
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Construit une image identifiée par le SHA du commit
      - name: Construire l'image Docker
        run: docker build -t myapp:${{ github.sha }} .

      # Affiche une confirmation
      - name: Confirmer le build
        run: echo "Image construite avec le tag myapp:${GITHUB_SHA}"
